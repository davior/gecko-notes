services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data/db:/app/data/db
      - ./data/media:/app/data/media
    environment:
      - DATABASE_URL=sqlite:////app/data/db/notes.db
      - MEDIA_DIR=/app/data/media
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - NOTE_VERSION_INTERVAL_MINUTES=${NOTE_VERSION_INTERVAL_MINUTES:-5}
      - NOTE_VERSION_MAX_COUNT=${NOTE_VERSION_MAX_COUNT:-50}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "18081:80"
    environment:
      - UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE:-1g}
    depends_on:
      - backend
networks:
  default:
