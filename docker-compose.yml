services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data/db:/app/data/db
      - ./data/media:/app/data/media
    environment:
      - DATABASE_URL=sqlite:////app/data/db/notes.db
      - MEDIA_DIR=/app/data/media
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - NOTE_VERSION_INTERVAL_MINUTES=${NOTE_VERSION_INTERVAL_MINUTES:-5}
      - NOTE_VERSION_MAX_COUNT=${NOTE_VERSION_MAX_COUNT:-50}
      # Article-to-video rendering (see .env.example).
      - RENDER_MAX_CONCURRENCY=${RENDER_MAX_CONCURRENCY:-1}
      - VIDEO_MAX_SHOTS=${VIDEO_MAX_SHOTS:-200}
      - VIDEO_MAX_NARRATION_CHARS=${VIDEO_MAX_NARRATION_CHARS:-60000}
      - VIDEO_JOB_RETENTION_DAYS=${VIDEO_JOB_RETENTION_DAYS:-14}
      # Server-side AI assistant runs (see .env.example).
      - ASSISTANT_MAX_CONCURRENCY=${ASSISTANT_MAX_CONCURRENCY:-2}
      - JOB_STALE_MINUTES=${JOB_STALE_MINUTES:-15}
      # Email (optional) — features stay off unless SMTP_HOST and SMTP_FROM are set.
      - APP_BASE_URL=${APP_BASE_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default
      - web
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18081}:80"
    environment:
      - UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE:-1g}
    depends_on:
      - backend
    networks:
      - default
      - web
networks:
  default:
    name: gecko-notes_default
  web:
    external: true
    name: web
