<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ app_name }}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f3f4f6; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#111827;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#ffffff; border-radius:16px; border:1px solid #e5e7eb; overflow:hidden;">
            <tr>
              <td style="padding:24px 32px 8px 32px; text-align:center;">
                <div style="font-size:32px; line-height:1;">🦎</div>
                <div style="font-size:18px; font-weight:600; margin-top:8px;">{{ app_name }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 32px 32px; font-size:15px; line-height:1.6;">
                {{ content | safe }}
              </td>
            </tr>
          </table>
          <div style="max-width:520px; padding:16px 32px; font-size:12px; color:#9ca3af; text-align:center;">
            You're receiving this email because an account action was requested at {{ app_name }}.
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
